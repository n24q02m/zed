name: git-ui-verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/git_ui_core/src/worktree_picker.rs"
      - "crates/project/src/git_store.rs"
      - "crates/git_ui_core/src/worktree_service.rs"
      - ".github/workflows/git-ui-verify.yml"

permissions:
  contents: read

jobs:
  git-ui:
    name: Git UI focused checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --package git_ui_core --package project

      - name: Run focused worktree picker test
        run: cargo test -p git_ui_core worktree_picker_view_model_keeps_stable_order_and_all_context --lib
