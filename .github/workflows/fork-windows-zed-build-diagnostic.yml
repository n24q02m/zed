# Fork-only verifier: build an exact debug Zed executable for native UI evidence.
name: fork-windows-zed-ui-binary

on:
  push:
    branches:
      - verify/windows-zed-build-diagnostic

permissions:
  contents: read

jobs:
  build:
    name: Build exact debug Zed UI binary
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_HOME: C:/c
      CARGO_INCREMENTAL: "1"
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out immutable verifier trigger
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: false

      - name: Resolve requested fork commit
        id: target
        shell: pwsh
        run: |
          $expected = (git log -1 --format=%s).Trim().ToLowerInvariant()
          if ($expected -notmatch "^[0-9a-f]{40}$") {
            throw "verifier trigger commits must use the target SHA as their subject"
          }
          "sha=$expected" >> $env:GITHUB_OUTPUT

      - name: Check out requested fork commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: source
          fetch-depth: 1
          clean: false

      - name: Verify immutable source identity
        id: source
        shell: pwsh
        working-directory: source
        run: |
          $expected = "${{ steps.target.outputs.sha }}"
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "checked out $actual, expected $expected"
          }
          "sha=$actual" >> $env:GITHUB_OUTPUT

      - name: Build exact debug Zed executable
        shell: pwsh
        working-directory: source
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1 | Out-String).Trim()
          $vsDevShell = Join-Path $vsInstall "Common7\Tools\Launch-VsDevShell.ps1"
          if ([string]::IsNullOrWhiteSpace($vsInstall) -or -not (Test-Path $vsDevShell)) {
            throw "GitHub-hosted Visual Studio developer shell was not found"
          }
          & $vsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC compiler was unavailable after entering the Visual Studio developer shell"
          }
          New-Item -ItemType Directory -Force $env:CARGO_HOME | Out-Null
          $started = Get-Date
          Write-Host "UI_BINARY_BUILD_START_UTC=$($started.ToUniversalTime().ToString('o'))"
          & cargo --color never build --package zed --target x86_64-pc-windows-msvc
          $exitCode = $LASTEXITCODE
          $finished = Get-Date
          Write-Host "UI_BINARY_BUILD_END_UTC=$($finished.ToUniversalTime().ToString('o'))"
          Write-Host "UI_BINARY_BUILD_ELAPSED_SECONDS=$([Math]::Round(($finished - $started).TotalSeconds, 3))"
          if ($exitCode -ne 0) {
            throw "debug Zed UI binary build failed with cargo exit code $exitCode"
          }
          $zed = "target/x86_64-pc-windows-msvc/debug/zed.exe"
          if (-not (Test-Path $zed)) {
            throw "debug Zed UI binary build did not produce $zed"
          }

      - name: Record binary provenance
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "source/target/x86_64-pc-windows-msvc/debug/zed.exe"
          $metadata = [ordered]@{
            source_sha = "${{ steps.source.outputs.sha }}"
            cargo_profile = "dev"
            cargo_command = "cargo --color never build --package zed --target x86_64-pc-windows-msvc"
            binary_sha256 = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          } | ConvertTo-Json
          $metadata | Set-Content -NoNewline -Encoding utf8 "$env:RUNNER_TEMP/fork-windows-ui-binary.json"

      - name: Upload runnable UI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-windows-ui-dev-${{ steps.source.outputs.sha }}
          path: |
            source/target/x86_64-pc-windows-msvc/debug/zed.exe
            source/target/x86_64-pc-windows-msvc/debug/*.dll
            ${{ runner.temp }}/fork-windows-ui-binary.json
          if-no-files-found: error
          retention-days: 1
