# Fork-only verifier: compile and run an explicit test filter on an immutable source.
# Separate trigger ref (verify/git-ui-targeted-test) so repairing test
# selection never launches duplicate Windows bundles on
# verify/windows-ui-smoke.
name: fork-git-ui-targeted-test-slices

on:
  push:
    branches:
      - verify/git-ui-targeted-test

permissions:
  contents: read

jobs:
  test:
    name: Test exact fork head slice tests
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_HOME: C:/c
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out immutable verifier trigger
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: false

      - name: Resolve requested fork commit
        id: target
        shell: pwsh
        run: |
          $request = (git log -1 --format=%s).Trim()
          if ($request -cnotmatch "^([0-9a-f]{40}) (git|git_ui|project) ([a-zA-Z0-9_:]+)$") {
            throw "push verifier subject must be: <full SHA> <git|git_ui|project> <test filter>"
          }
          "sha=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "package=$($Matches[2])" >> $env:GITHUB_OUTPUT
          "filter=$($Matches[3])" >> $env:GITHUB_OUTPUT

      - name: Check out requested fork commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: source
          fetch-depth: 1
          clean: false

      - name: Verify immutable source identity
        shell: pwsh
        working-directory: source
        run: |
          $expected = "${{ steps.target.outputs.sha }}"
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "checked out $actual, expected $expected"
          }

      - name: Run requested source tests
        shell: pwsh
        working-directory: source
        env:
          TEST_PACKAGE: ${{ steps.target.outputs.package }}
          TEST_FILTER: ${{ steps.target.outputs.filter }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1 | Out-String).Trim()
          $vsDevShell = Join-Path $vsInstall "Common7\Tools\Launch-VsDevShell.ps1"
          if ([string]::IsNullOrWhiteSpace($vsInstall) -or -not (Test-Path $vsDevShell)) {
            throw "GitHub-hosted Visual Studio developer shell was not found"
          }
          & $vsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC compiler was unavailable after entering the Visual Studio developer shell"
          }
          # Cargo's default user-profile cache cannot check out the pinned
          # dependency fixture within Windows MAX_PATH. Keep only Cargo's cache
          # at this short job-local root; rustup remains at the runner default.
          New-Item -ItemType Directory -Force $env:CARGO_HOME | Out-Null
          # Cargo succeeds when a filter matches nothing. Require a real,
          # successful result for this exact requested filter, not a sibling.
          $testLog = Join-Path $env:RUNNER_TEMP "fork-targeted-source-test.log"
          if ($env:TEST_PACKAGE -eq "project" -and $env:TEST_FILTER -eq "test_auto_fetch") {
            & cargo --color never test -p $env:TEST_PACKAGE --test integration $env:TEST_FILTER -- 2>&1 | Tee-Object -FilePath $testLog
          } else {
            & cargo --color never test -p $env:TEST_PACKAGE --lib $env:TEST_FILTER -- 2>&1 | Tee-Object -FilePath $testLog
          }
          if ($LASTEXITCODE -ne 0) {
            throw "requested source tests failed with cargo exit code $LASTEXITCODE"
          }
          $testOutput = Get-Content -Raw $testLog
          $resultMatches = [regex]::Matches($testOutput, "test result: ok\. (\d+) passed; (\d+) failed;")
          if ($resultMatches.Count -ne 1 -or [int]$resultMatches[0].Groups[1].Value -lt 1 -or [int]$resultMatches[0].Groups[2].Value -ne 0) {
            throw "requested test filter must execute at least one passing test and zero failing tests"
          }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) {
            throw "cargo fmt --check failed"
          }
          $dirty = git status --porcelain
          if ($dirty) {
            throw "candidate source worktree changed during verification: $dirty"
          }
