# Fork-only verifier: build a supplied immutable fork commit for native UI evidence.
name: fork-windows-ui-smoke

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character fork commit SHA to build
        required: true
        type: string
  push:
    branches:
      - verify/windows-ui-smoke

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle exact fork head for UI smoke evidence
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CARGO_HOME: C:/c
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      RELEASE_VERSION: "0.0.0"
    steps:
      - name: Check out immutable verifier trigger
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: false

      - name: Resolve requested fork commit
        id: target
        shell: pwsh
        env:
          DISPATCH_COMMIT: ${{ inputs.commit }}
        run: |
          $expected = $env:DISPATCH_COMMIT.Trim()
          if ([string]::IsNullOrWhiteSpace($expected)) {
            $expected = (git log -1 --format=%s).Trim()
          }
          $expected = $expected.ToLowerInvariant()
          if ($expected -notmatch "^[0-9a-f]{40}$") {
            throw "commit must be a 40-character SHA; push verifier commits must use the target SHA as their subject"
          }
          "sha=$expected" >> $env:GITHUB_OUTPUT

      - name: Check out requested fork commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: source
          fetch-depth: 1
          clean: false

      - name: Verify immutable source identity
        id: source
        shell: pwsh
        working-directory: source
        run: |
          $expected = "${{ steps.target.outputs.sha }}"
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "checked out $actual, expected $expected"
          }
          "sha=$actual" >> $env:GITHUB_OUTPUT

      - name: Bundle unsigned Windows application
        shell: pwsh
        working-directory: source
        env:
          ZED_WORKSPACE: ${{ github.workspace }}/source
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "GitHub-hosted Visual Studio discovery tool was not found: $vswhere"
          }
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1 | Out-String).Trim()
          $vsDevShell = Join-Path $vsInstall "Common7\Tools\Launch-VsDevShell.ps1"
          if ([string]::IsNullOrWhiteSpace($vsInstall) -or -not (Test-Path $vsDevShell)) {
            throw "GitHub-hosted Visual Studio developer shell was not found"
          }
          # Keep Cargo's Git checkout cache below Windows MAX_PATH; Rustup remains on the runner default.
          New-Item -ItemType Directory -Force $env:CARGO_HOME | Out-Null
          $sourceScript = Get-Content "script/bundle-windows.ps1" -Raw
          $hardcodedDevShell = '& "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1"'
          $patchedDevShell = '& "' + $vsDevShell + '"'
          $patchedScript = $sourceScript.Replace($hardcodedDevShell, $patchedDevShell)
          if ($patchedScript -eq $sourceScript) {
            throw "could not replace the candidate bundle script's fixed Visual Studio path"
          }
          $bundleScript = Join-Path (Get-Location) "script/.fork-ui-smoke-bundle-windows.ps1"
          try {
            Set-Content -Path $bundleScript -Value $patchedScript -Encoding utf8
            & $bundleScript -Architecture x86_64
          }
          finally {
            if (Test-Path $bundleScript) {
              Remove-Item -Force $bundleScript
            }
          }
          $dirty = git status --porcelain
          if ($dirty) {
            throw "candidate source worktree changed during bundling: $dirty"
          }

      - name: Record binary provenance
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "source/inno/x86_64/Zed.exe"
          if (-not (Test-Path $binary)) {
            throw "expected bundle executable was not produced: $binary"
          }
          $metadata = [ordered]@{
            source_sha = "${{ steps.source.outputs.sha }}"
            binary_sha256 = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          } | ConvertTo-Json
          $metadata | Set-Content -NoNewline -Encoding utf8 "$env:RUNNER_TEMP/fork-windows-ui-smoke.json"

      - name: Upload runnable UI bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-windows-ui-${{ steps.source.outputs.sha }}
          path: |
            source/inno/x86_64
            ${{ runner.temp }}/fork-windows-ui-smoke.json
          if-no-files-found: error
          retention-days: 1
